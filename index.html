<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全球市場准入 (GMA) 認證要求查詢系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #f1f5f9;
    }
    .fade-in {
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    optgroup { font-weight: 700; color: #1e3a8a; background-color: #e2e8f0; }
    option { font-weight: 500; color: #334155; background-color: #ffffff; }
    
    /* 自訂反灰樣式，用於不適用的認證卡片 */
    .card-disabled {
      opacity: 0.55;
      filter: grayscale(80%);
      transition: all 0.3s ease;
    }
    .card-disabled:hover {
      opacity: 0.8;
      filter: grayscale(0%);
    }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col items-center py-10 px-4 sm:px-6 lg:px-8">

  <div class="w-full max-w-6xl relative">

    <!-- Header -->
    <div class="text-center mb-10">
      <h1 class="text-3xl md:text-4xl font-black text-blue-900 mb-3 flex justify-center items-center gap-3 tracking-wide">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        全球 GMA 市場准入查詢系統
      </h1>
      <p class="text-slate-500 text-sm md:text-base font-medium">智能複選版：支援 34 國法規，可「疊加」多項產品屬性以判斷綜合合規門檻</p>
    </div>

    <!-- 選擇器區塊 (國家 + 複選屬性) -->
    <div class="bg-white rounded-3xl shadow-lg shadow-slate-200/50 border border-slate-100 p-6 md:p-8 mb-8 mx-auto max-w-5xl relative z-10">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        
        <!-- 國家選擇器 -->
        <div>
          <label for="countrySelect" class="block text-sm md:text-base font-bold text-slate-700 mb-3 tracking-wide flex items-center gap-2">
            🌍 第一步：選擇目標國家
          </label>
          <div class="relative">
            <select id="countrySelect" onchange="updateDashboard()" class="block w-full appearance-none bg-slate-50 border-2 border-slate-200 text-slate-800 py-3.5 px-4 pr-8 rounded-xl leading-tight focus:outline-none focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all font-medium cursor-pointer">
              <option value="">-- 請選擇國家 / 地區 --</option>
              <optgroup label="🌏 亞洲與大洋洲 (APAC)">
                <option value="TW">🇹🇼 台灣 (Taiwan)</option>
                <option value="CN">🇨🇳 中國大陸 (China)</option>
                <option value="JP">🇯🇵 日本 (Japan)</option>
                <option value="KR">🇰🇷 韓國 (South Korea)</option>
                <option value="IN">🇮🇳 印度 (India)</option>
                <option value="AU">🇦🇺 澳洲 (Australia)</option>
                <option value="NZ">🇳🇿 紐西蘭 (New Zealand)</option>
                <option value="SG">🇸🇬 新加坡 (Singapore)</option>
                <option value="MY">🇲🇾 馬來西亞 (Malaysia)</option>
                <option value="TH">🇹🇭 泰國 (Thailand)</option>
                <option value="VN">🇻🇳 越南 (Vietnam)</option>
                <option value="ID">🇮🇩 印尼 (Indonesia)</option>
                <option value="PH">🇵🇭 菲律賓 (Philippines)</option>
              </optgroup>
              <optgroup label="🌎 美洲地區 (Americas)">
                <option value="US">🇺🇸 美國 (United States)</option>
                <option value="CA">🇨🇦 加拿大 (Canada)</option>
                <option value="BR">🇧🇷 巴西 (Brazil)</option>
                <option value="MX">🇲🇽 墨西哥 (Mexico)</option>
                <option value="AR">🇦🇷 阿根廷 (Argentina)</option>
                <option value="CL">🇨🇱 智利 (Chile)</option>
                <option value="CO">🇨🇴 哥倫比亞 (Colombia)</option>
                <option value="PE">🇵🇪 秘魯 (Peru)</option>
              </optgroup>
              <optgroup label="🌍 歐洲與獨立國協 (Europe & CIS)">
                <option value="EU">🇪🇺 歐盟 (European Union)</option>
                <option value="UK">🇬🇧 英國 (United Kingdom)</option>
                <option value="RU">🇷🇺 俄羅斯/EAEU (Russia/EAEU)</option>
                <option value="UA">🇺🇦 烏克蘭 (Ukraine)</option>
                <option value="RS">🇷🇸 塞爾維亞 (Serbia)</option>
              </optgroup>
              <optgroup label="🏜️ 中東與非洲 (MEA)">
                <option value="SA">🇸🇦 沙烏地阿拉伯 (Saudi Arabia)</option>
                <option value="AE">🇦🇪 阿拉伯聯合大公國 (UAE)</option>
                <option value="ZA">🇿🇦 南非 (South Africa)</option>
                <option value="EG">🇪🇬 埃及 (Egypt)</option>
                <option value="IL">🇮🇱 以色列 (Israel)</option>
                <option value="KW">🇰🇼 科威特 (Kuwait)</option>
                <option value="NG">🇳🇬 奈及利亞 (Nigeria)</option>
                <option value="KE">🇰🇪 肯亞 (Kenya)</option>
                <option value="MA">🇲🇦 摩洛哥 (Morocco)</option>
              </optgroup>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
              <svg class="fill-current h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
            </div>
          </div>
        </div>

        <!-- 產品類別選擇器 (動態標籤) -->
        <div>
          <label class="block text-sm md:text-base font-bold text-slate-700 mb-3 tracking-wide flex items-center gap-2">
            📦 第二步：選擇產品屬性 <span class="text-xs text-indigo-500 bg-indigo-50 px-2 py-1 rounded-md font-black">可複選疊加</span>
          </label>
          <div id="categoryTogglesContainer" class="flex flex-wrap gap-2">
            <!-- JS 動態生成按鈕 -->
          </div>
        </div>

      </div>
    </div>

    <!-- 初始空狀態 -->
    <div id="emptyState" class="text-center py-16">
      <div class="inline-flex items-center justify-center w-24 h-24 rounded-full bg-blue-100 mb-6 shadow-inner">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z" />
        </svg>
      </div>
      <h3 class="text-2xl font-bold text-slate-400">請於上方選擇國家與產品類別</h3>
      <p class="text-slate-400 mt-2">系統將為您智慧過濾並帶出對應的法規與測試要求</p>
    </div>

    <!-- 結果展示區塊 -->
    <div id="resultDashboard" class="hidden fade-in space-y-6">
      
      <!-- 國家標題與簡介 (含電氣規格) -->
      <div class="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-slate-200 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-2 h-full bg-blue-600"></div>
        <div class="flex flex-col lg:flex-row justify-between gap-6">
          <div class="flex-1">
            <h2 id="countryTitle" class="text-3xl md:text-4xl font-black text-slate-800 mb-3 tracking-tight"></h2>
            <p id="countryDesc" class="text-slate-600 leading-relaxed text-lg font-medium"></p>
          </div>
          
          <!-- 電氣與插頭規格卡片 -->
          <div class="flex-shrink-0 bg-blue-50/80 rounded-2xl p-5 border border-blue-100 flex flex-col sm:flex-row gap-6 min-w-[320px]">
            <div class="flex items-center gap-4">
              <div class="p-3 bg-white rounded-full shadow-sm text-yellow-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
              </div>
              <div>
                <p class="text-xs font-bold text-blue-500 uppercase tracking-widest mb-1">市電電壓與頻率</p>
                <p id="localVoltage" class="text-xl font-black text-blue-900"></p>
              </div>
            </div>
            <div class="hidden sm:block w-px bg-blue-200"></div>
            <div class="flex items-center gap-4">
              <div class="p-3 bg-white rounded-full shadow-sm text-blue-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                  <circle cx="9" cy="8" r="2" fill="currentColor"/>
                  <circle cx="15" cy="8" r="2" fill="currentColor"/>
                </svg>
              </div>
              <div>
                <p class="text-xs font-bold text-blue-500 uppercase tracking-widest mb-1">標準插頭規格</p>
                <p id="localPlug" class="text-xl font-black text-blue-900"></p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 🔒 產品類別專屬：強制規格界限 -->
      <div class="bg-gradient-to-br from-slate-800 to-slate-900 text-white rounded-3xl p-6 md:p-8 shadow-lg border border-slate-700">
        <div class="flex items-center gap-3 mb-5">
          <div class="p-2.5 bg-indigo-500 text-white rounded-xl shadow-md">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" />
            </svg>
          </div>
          <h3 class="text-2xl font-black tracking-wide">📦 組合屬性解析：強制界限與特例</h3>
        </div>
        <div id="categorySpecificRule" class="text-slate-200 font-medium text-base md:text-lg leading-relaxed bg-slate-800/50 p-5 rounded-2xl border border-slate-600 space-y-4">
          <!-- 專屬文字動態注入區 -->
        </div>
      </div>

      <!-- 各領域專業認證與當地測試要求 -->
      <div class="pt-2">
        <h3 class="text-2xl font-black text-slate-800 mb-5 flex items-center gap-3">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" />
          </svg>
          智能適配：標誌與測試門檻
        </h3>
        <div id="categoriesContainer" class="grid grid-cols-1 md:grid-cols-3 gap-5">
        </div>
      </div>

      <!-- 當地代理商 -->
      <div class="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-slate-200">
        <div class="flex items-center gap-3 mb-4">
          <div class="p-2.5 bg-red-50 text-red-600 rounded-xl">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
            </svg>
          </div>
          <h3 class="text-2xl font-black text-slate-800">🏢 當地進口商與代理 (Local Rep) 實務規定</h3>
        </div>
        <p id="localAgent" class="text-slate-700 bg-slate-50 p-5 rounded-2xl border border-slate-100 leading-relaxed font-medium text-lg"></p>
      </div>

      <!-- 申請流程與文件 -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-slate-200">
          <div class="flex items-center gap-3 mb-5">
            <div class="p-2.5 bg-emerald-50 text-emerald-600 rounded-xl">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
              </svg>
            </div>
            <h3 class="text-2xl font-black text-slate-800">📋 實務申請與審查流程</h3>
          </div>
          <ul id="processList" class="space-y-4 text-slate-700 list-none pl-1 font-medium"></ul>
        </div>

        <div class="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-slate-200">
          <div class="flex items-center gap-3 mb-5">
            <div class="p-2.5 bg-amber-50 text-amber-600 rounded-xl">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
              </svg>
            </div>
            <h3 class="text-2xl font-black text-slate-800">📂 應備技術文件與標章打件</h3>
          </div>
          <ul id="docList" class="space-y-3 text-slate-700 list-disc pl-5 marker:text-amber-400 font-medium"></ul>
        </div>
      </div>

    </div>
  </div>

  <script>
    // --- 選單定義 ---
    const categoryOptions = [
      { id: "ALL", label: "🌐 全產品總覽", icon: "🌐" },
      { id: "HOME_APP", label: "🔌 一般家電與影音", icon: "🔌" },
      { id: "IT_POWER", label: "💻 IT 資訊設備與電源", icon: "💻" },
      { id: "BATTERY", label: "🔋 鋰電池與儲能", icon: "🔋" },
      { id: "WIRELESS", label: "📡 消費性無線設備", icon: "📡" },
      { id: "IND_TELECOM", label: "🏭 工業網通產品", icon: "🏭" },
      { id: "CELLULAR", label: "📱 4G LTE / 5G NR", icon: "📱" }
    ];

    let selectedCategories = ["ALL"];

    function initCategoryToggles() {
      const container = document.getElementById("categoryTogglesContainer");
      container.innerHTML = categoryOptions.map(opt => {
        const isActive = selectedCategories.includes(opt.id);
        const activeClasses = isActive 
          ? "bg-indigo-600 text-white border-indigo-600 shadow-md shadow-indigo-200 scale-105" 
          : "bg-white text-slate-600 border-slate-200 hover:bg-slate-50 hover:border-indigo-300";
        return `<button onclick="toggleCategory('${opt.id}')" class="px-4 py-2.5 rounded-xl border-2 font-bold text-sm md:text-base transition-all duration-200 ${activeClasses}">${opt.label}</button>`;
      }).join("");
    }

    function toggleCategory(id) {
      if (id === "ALL") {
        selectedCategories = ["ALL"];
      } else {
        selectedCategories = selectedCategories.filter(c => c !== "ALL");
        if (selectedCategories.includes(id)) {
          selectedCategories = selectedCategories.filter(c => c !== id);
          if (selectedCategories.length === 0) selectedCategories = ["ALL"];
        } else {
          selectedCategories.push(id);
        }
      }
      initCategoryToggles();
      updateDashboard();
    }

    document.addEventListener("DOMContentLoaded", initCategoryToggles);

    // --- Data Base (全 34 國完整法規與產品分類規則) ---
    // 💡 特別深度優化 TH (泰國) 實務細節
    const gmaData = {
      "TW": {
        title: "🇹🇼 台灣 (Taiwan)",
        desc: "電機電子產品主要受 BSMI 與 NCC 管制。近年 BSMI 擴大管制儲能系統及影音周邊，且證書多有 3 年效期限制。",
        electrical: { voltage: "110V / 60Hz", plug: "Type A, B (美規平行與接地)" },
        categories: [
          { type: "Safety (安規)", mark: "BSMI", status: "🔴 強制認證", testing: "✅ 接受 CB 或具備 MRA 認可之海外實驗室報告轉證。" },
          { type: "EMC (電磁相容)", mark: "BSMI", status: "🔴 強制認證", testing: "✅ 接受官方認可之海外合格 EMC 實驗室報告轉證。" },
          { type: "RF/Telecom (電信射頻)", mark: "NCC", status: "🔴 強制認證", testing: "✅ 接受 FCC/CE 等測試報告向台灣的 RCB (驗證機構) 申請型式認可轉證。" }
        ],
        categoryRules: {
          HOME_APP: "任何直接插市電 (AC 110V/220V) 運行的家用設備（如吹風機、微波爐、電視）均強制 BSMI 安全與 EMC 驗證 (通常為 RPC 驗證登錄)。",
          IT_POWER: "所有獨立銷售或隨附的 AC/DC 電源適配器、充電器、電腦主機與電源供應器，強制納入 BSMI 檢驗目錄。",
          WIRELESS: "所有具備藍牙、Wi-Fi 之消費性網通設備，強制 NCC 低功率射頻認證。若產品同時插市電運作，則須「同時」取得 BSMI 與 NCC 雙認證。",
          BATTERY: "可攜式鋰電池、行動電源、3C 二次電池為強制 BSMI。2024 年新制：100kWh 以下定置型儲能鋰電池系統亦全面納入強制檢驗。",
          IND_TELECOM: "工業級交換機、路由器若具備電信介面或公網接入功能，強制須通過 NCC 電信終端設備審驗。工業設備之安規視是否在 BSMI 應施檢驗目錄而定。",
          CELLULAR: "行動寬頻產品強制受 NCC PLMN 規範 (如 PLMN09, PLMN12) 管制，需提交射頻、EMC 與 SAR(人體電磁波吸收) 報告核准。",
          ALL: "依產品供電方式與發射頻率，分別受 BSMI (安規/EMC) 與 NCC (射頻/電信) 管制；電池與電源適配器亦在強力監管範圍內。"

        li.className = "flex gap-4 items-start";
        li.innerHTML = `
          <span class="flex-shrink-0 flex items-center justify-center w-7 h-7 rounded-full bg-emerald-100 text-emerald-700 text-sm font-black mt-0.5 shadow-sm">${index + 1}</span>
          <span class="pt-0.5">${step}</span>
        `;
        processList.appendChild(li);
      });

      const docList = document.getElementById("docList");
      docList.innerHTML = "";
      data.docs.forEach(doc => {
        const li = document.createElement("li");
        li.className = "mb-1";
        li.innerText = doc;
        docList.appendChild(li);
      });

      emptyState.style.display = "none";
      dashboard.style.display = "block";
      
      dashboard.classList.remove("fade-in");
      void dashboard.offsetWidth; 
      dashboard.classList.add("fade-in");
    }
  </script>
</body>
</html>
