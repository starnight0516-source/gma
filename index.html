<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全球市場准入 (GMA) 認證要求查詢系統 - 頻譜與精準細項版</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #f1f5f9;
    }
    .fade-in {
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    optgroup { font-weight: 700; color: #1e3a8a; background-color: #e2e8f0; }
    option { font-weight: 500; color: #334155; background-color: #ffffff; }
    
    .card-disabled {
      opacity: 0.55;
      filter: grayscale(80%);
      transition: all 0.3s ease;
    }
    .card-disabled:hover {
      opacity: 0.8;
      filter: grayscale(0%);
    }
    
    .tag-btn {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .tag-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col items-center py-10 px-4 sm:px-6 lg:px-8">

  <div class="w-full max-w-6xl relative">

    <!-- Header -->
    <div class="text-center mb-10">
      <h1 class="text-3xl md:text-4xl font-black text-blue-900 mb-3 flex justify-center items-center gap-3 tracking-wide">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        全球 GMA 市場准入查詢系統
      </h1>
      <p class="text-slate-500 text-sm md:text-base font-medium">無線頻譜與精細類別版：支援 34 國法規，涵蓋 Wi-Fi 6E、UWB、NB-IoT 等前沿技術解析</p>
    </div>

    <!-- 選擇器區塊 -->
    <div class="bg-white rounded-3xl shadow-lg shadow-slate-200/50 border border-slate-100 p-6 md:p-8 mb-8 mx-auto max-w-6xl relative z-10">
      
      <!-- 第一步：國家選擇 -->
      <div class="mb-8 border-b border-slate-100 pb-8">
        <label for="countrySelect" class="block text-lg font-bold text-slate-700 mb-4 tracking-wide flex items-center gap-2">
          🌍 第一步：選擇目標國家
        </label>
        <div class="relative max-w-2xl">
          <select id="countrySelect" onchange="updateDashboard()" class="block w-full appearance-none bg-slate-50 border-2 border-slate-200 text-slate-800 py-3.5 px-4 pr-8 rounded-xl leading-tight focus:outline-none focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all font-bold text-lg cursor-pointer shadow-sm">
            <option value="">-- 點擊展開全球市場清單 --</option>
            <optgroup label="🌏 亞洲與大洋洲 (APAC)">
              <option value="TW">🇹🇼 台灣 (Taiwan)</option>
              <option value="CN">🇨🇳 中國大陸 (China)</option>
              <option value="JP">🇯🇵 日本 (Japan)</option>
              <option value="KR">🇰🇷 韓國 (South Korea)</option>
              <option value="IN">🇮🇳 印度 (India)</option>
              <option value="AU">🇦🇺 澳洲 (Australia)</option>
              <option value="NZ">🇳🇿 紐西蘭 (New Zealand)</option>
              <option value="SG">🇸🇬 新加坡 (Singapore)</option>
              <option value="MY">🇲🇾 馬來西亞 (Malaysia)</option>
              <option value="TH">🇹🇭 泰國 (Thailand)</option>
              <option value="VN">🇻🇳 越南 (Vietnam)</option>
              <option value="ID">🇮🇩 印尼 (Indonesia)</option>
              <option value="PH">🇵🇭 菲律賓 (Philippines)</option>
            </optgroup>
            <optgroup label="🌎 美洲地區 (Americas)">
              <option value="US">🇺🇸 美國 (United States)</option>
              <option value="CA">🇨🇦 加拿大 (Canada)</option>
              <option value="BR">🇧🇷 巴西 (Brazil)</option>
              <option value="MX">🇲🇽 墨西哥 (Mexico)</option>
              <option value="AR">🇦🇷 阿根廷 (Argentina)</option>
              <option value="CL">🇨🇱 智利 (Chile)</option>
              <option value="CO">🇨🇴 哥倫比亞 (Colombia)</option>
              <option value="PE">🇵🇪 秘魯 (Peru)</option>
            </optgroup>
            <optgroup label="🌍 歐洲與獨立國協 (Europe & CIS)">
              <option value="EU">🇪🇺 歐盟 (European Union)</option>
              <option value="UK">🇬🇧 英國 (United Kingdom)</option>
              <option value="RU">🇷🇺 俄羅斯/EAEU (Russia/EAEU)</option>
              <option value="UA">🇺🇦 烏克蘭 (Ukraine)</option>
              <option value="RS">🇷🇸 塞爾維亞 (Serbia)</option>
            </optgroup>
            <optgroup label="🏜️ 中東與非洲 (MEA)">
              <option value="SA">🇸🇦 沙烏地阿拉伯 (Saudi Arabia)</option>
              <option value="AE">🇦🇪 阿拉伯聯合大公國 (UAE)</option>
              <option value="ZA">🇿🇦 南非 (South Africa)</option>
              <option value="EG">🇪🇬 埃及 (Egypt)</option>
              <option value="IL">🇮🇱 以色列 (Israel)</option>
              <option value="KW">🇰🇼 科威特 (Kuwait)</option>
              <option value="NG">🇳🇬 奈及利亞 (Nigeria)</option>
              <option value="KE">🇰🇪 肯亞 (Kenya)</option>
              <option value="MA">🇲🇦 摩洛哥 (Morocco)</option>
            </optgroup>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
            <svg class="fill-current h-6 w-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
          </div>
        </div>
      </div>

      <!-- 第二步：產品大類多選 -->
      <div class="mb-8 border-b border-slate-100 pb-8">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-5 gap-3">
          <label class="block text-lg font-bold text-slate-700 tracking-wide flex items-center gap-2">
            📦 第二步：選擇產品大類別 
            <span class="text-xs text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md font-black border border-indigo-200">支援多選疊加</span>
          </label>
          <button onclick="toggleCategory('ALL')" id="btn-all" class="text-sm font-bold px-5 py-2 rounded-lg border-2 border-slate-300 text-slate-600 hover:bg-slate-50 transition-colors">
            🌐 重置為全類別總覽
          </button>
        </div>

        <div id="groupedCategoriesContainer" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <!-- JS 動態生成分組面板 -->
        </div>
      </div>

      <!-- 第三步：細項產品與特定射頻選擇器 -->
      <div>
        <label for="specificProductSelect" class="block text-lg font-bold text-slate-700 mb-3 tracking-wide flex items-center gap-2">
          🎯 第三步：精確產品細項與射頻技術 <span class="text-xs text-amber-600 bg-amber-50 px-2.5 py-1 rounded-md font-black border border-amber-200">深度診斷 (選填)</span>
        </label>
        <div class="relative max-w-2xl">
          <select id="specificProductSelect" onchange="updateDashboard()" class="block w-full appearance-none bg-amber-50/50 border-2 border-amber-200 text-amber-900 py-3.5 px-4 pr-8 rounded-xl leading-tight focus:outline-none focus:bg-white focus:border-amber-500 focus:ring-4 focus:ring-amber-500/20 transition-all font-bold text-base cursor-pointer shadow-sm">
            <option value="">-- 不指定 (僅查看大類別通用規範) --</option>
            <!-- JS 動態生成選項 -->
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-amber-600">
            <svg class="fill-current h-6 w-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" /></svg>
          </div>
        </div>
        <p class="text-sm text-slate-500 mt-2 font-medium">💡 選擇特定的細項產品或 RF 射頻技術，系統將帶出專屬的頻譜法規與豁免條件。</p>
      </div>

    </div>

    <!-- 初始空狀態 -->
    <div id="emptyState" class="text-center py-20">
      <div class="inline-flex items-center justify-center w-28 h-28 rounded-full bg-blue-100 mb-6 shadow-inner">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-14 w-14 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z" />
        </svg>
      </div>
      <h3 class="text-2xl font-bold text-slate-400">請於上方選擇國家與產品分類</h3>
      <p class="text-slate-400 mt-2 font-medium">系統將為您帶出經官方指南驗證的強制法規與頻譜解析</p>
    </div>

    <!-- 結果展示區塊 -->
    <div id="resultDashboard" class="hidden fade-in space-y-6">
      
      <!-- 國家標題與簡介 (含電氣規格) -->
      <div class="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-slate-200 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-2 h-full bg-blue-600"></div>
        <div class="flex flex-col lg:flex-row justify-between gap-6">
          <div class="flex-1">
            <h2 id="countryTitle" class="text-3xl md:text-4xl font-black text-slate-800 mb-3 tracking-tight"></h2>
            <p id="countryDesc" class="text-slate-600 leading-relaxed text-lg font-medium"></p>
          </div>
          
          <!-- 電氣與插頭規格卡片 -->
          <div id="electricalInfoCard" class="flex-shrink-0 bg-blue-50/80 rounded-2xl p-5 border border-blue-100 flex flex-col sm:flex-row gap-6 min-w-[320px]">
            <div class="flex items-center gap-4">
              <div class="p-3 bg-white rounded-full shadow-sm text-yellow-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
              </div>
              <div>
                <p class="text-xs font-bold text-blue-500 uppercase tracking-widest mb-1">市電電壓與頻率</p>
                <p id="localVoltage" class="text-xl font-black text-blue-900"></p>
              </div>
            </div>
            <div class="hidden sm:block w-px bg-blue-200"></div>
            <div class="flex items-center gap-4">
              <div class="p-3 bg-white rounded-full shadow-sm text-blue-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                  <circle cx="9" cy="8" r="2" fill="currentColor"/>
                  <circle cx="15" cy="8" r="2" fill="currentColor"/>
                </svg>
              </div>
              <div>
                <p class="text-xs font-bold text-blue-500 uppercase tracking-widest mb-1">標準插頭規格</p>
                <p id="localPlug" class="text-xl font-black text-blue-900"></p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 🔒 產品類別專屬：強制規格界限 -->
      <div class="bg-gradient-to-br from-slate-800 to-slate-900 text-white rounded-3xl p-6 md:p-8 shadow-lg border border-slate-700">
        <div class="flex items-center gap-3 mb-6">
          <div class="p-2.5 bg-indigo-500 text-white rounded-xl shadow-md">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" />
            </svg>
          </div>
          <h3 class="text-2xl font-black tracking-wide">📦 技術與頻譜分析 (適用範圍與痛點)</h3>
        </div>
        <div id="categorySpecificRule" class="text-slate-200 font-medium text-base md:text-lg leading-relaxed bg-slate-800/50 p-6 rounded-2xl border border-slate-600 space-y-4">
          <!-- 專屬文字動態注入區 -->
        </div>
      </div>

      <!-- 各領域專業認證與當地測試要求 -->
      <div class="pt-2">
        <h3 class="text-2xl font-black text-slate-800 mb-5 flex items-center gap-3">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" />
          </svg>
          官方認證矩陣 (Official Certification Matrix)
        </h3>
        <div id="categoriesContainer" class="grid grid-cols-1 md:grid-cols-3 gap-5">
        </div>
      </div>

      <!-- 當地代理商 -->
      <div class="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-slate-200">
        <div class="flex items-center gap-3 mb-4">
          <div class="p-2.5 bg-red-50 text-red-600 rounded-xl">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
            </svg>
          </div>
          <h3 class="text-2xl font-black text-slate-800">🏢 當地代理商 (Local Representative) 要求</h3>
        </div>
        <p id="localAgent" class="text-slate-700 bg-slate-50 p-5 rounded-2xl border border-slate-100 leading-relaxed font-medium text-lg"></p>
      </div>

    </div>
  </div>

  <script>
    // --- 選單定義 (10大專業大類，分 3 大群組) ---
    const categoryGroups = [
      {
        name: "🔌 電源與被動組件",
        bgClass: "bg-blue-50/40 border-blue-100",
        items: [
          { id: "POWER", label: "電源適配器與充電器" },
          { id: "BATTERY", label: "鋰電池與儲能系統" },
          { id: "COMPONENT", label: "插頭 / 線材 / 開關" }
        ]
      },
      {
        name: "🏠 商業與消費電子",
        bgClass: "bg-emerald-50/40 border-emerald-100",
        items: [
          { id: "HOME_APP", label: "一般家電與影音設備" },
          { id: "IT_OFFICE", label: "商用 IT 與辦公設備" },
          { id: "WIFI_BT", label: "消費性無線與短距通訊" }
        ]
      },
      {
        name: "🏭 工業網通與邊緣運算",
        bgClass: "bg-purple-50/60 border-purple-200",
        items: [
          { id: "IND_SWITCH", label: "工業交換機與防護設備" },
          { id: "IND_COMPUTING", label: "工業電腦與工控機" },
          { id: "IND_CELLULAR", label: "蜂窩通訊與工業雷達" }
        ]
      }
    ];

    // --- 新增：22 種精確細項產品與無線技術對應表 ---
    const specificProductsMap = {
      "HOME_APP": [
        { id: "SP_WHITE_GOODS", label: "大型白家電 (冰箱/空調/洗衣機)" },
        { id: "SP_SMALL_APP", label: "一般小家電 (風扇/吸塵器/照明)" },
        { id: "SP_MICROWAVE", label: "微波爐 / 發熱高危家電" },
        { id: "SP_TV", label: "電視機 / 影音顯示設備" }
      ],
      "IT_OFFICE": [
        { id: "SP_LAPTOP", label: "筆記型電腦 / 平板" },
        { id: "SP_SERVER", label: "伺服器 / 企業級運算設備" },
        { id: "SP_PERIPHERAL", label: "低壓週邊 (滑鼠/鍵盤/隨身碟)" }
      ],
      "POWER": [
        { id: "SP_AC_ADAPTER", label: "外接 AC/DC 電源適配器" },
        { id: "SP_UPS", label: "不斷電系統 (UPS)" },
        { id: "SP_IND_POWER", label: "工業用電源供應器 (DIN-Rail/Open Frame)" }
      ],
      "BATTERY": [
        { id: "SP_POWER_BANK", label: "行動電源 (Power Bank)" },
        { id: "SP_CELL", label: "可攜式二次鋰電池包" },
        { id: "SP_ESS", label: "大型定置型儲能系統 (ESS)" }
      ],
      "COMPONENT": [
        { id: "SP_PLUG", label: "AC 插頭與電源線組" },
        { id: "SP_SWITCH", label: "家用開關與無熔絲斷路器" }
      ],
      "WIFI_BT": [
        { id: "SP_BT_SPEAKER", label: "一般藍牙設備 (音箱/耳機/BLE)" },
        { id: "SP_WIFI_STANDARD", label: "標準 Wi-Fi 設備 (2.4GHz / 5GHz)" },
        { id: "SP_WIFI_6E", label: "新世代 Wi-Fi 6E/7 (6GHz 頻段)" },
        { id: "SP_RFID_NFC", label: "RFID / NFC / 短距離通訊 (SRD)" },
        { id: "SP_UWB", label: "UWB 超寬頻技術設備" }
      ],
      "IND_SWITCH": [
        { id: "SP_DIN_SWITCH", label: "DIN-Rail 工業交換機" },
        { id: "SP_FIREWALL", label: "工業級防火牆 / 網路安全設備" }
      ],
      "IND_COMPUTING": [
        { id: "SP_FANLESS_IPC", label: "無風扇工控機 (Fanless IPC)" },
        { id: "SP_PANEL_PC", label: "工業觸控平板電腦 (Panel PC)" }
      ],
      "IND_CELLULAR": [
        { id: "SP_5G_ROUTER", label: "4G LTE / 5G NR 工業路由器" },
        { id: "SP_NB_IOT", label: "NB-IoT / LTE-M 低功耗廣域網路模組" },
        { id: "SP_VEHICLE_RADAR", label: "車載與工業雷達 (24GHz/76-81GHz)" }
      ]
    };

    let selectedCategories = ["ALL"]; 

    function initCategoryToggles() {
      const container = document.getElementById("groupedCategoriesContainer");
      container.innerHTML = categoryGroups.map(group => {
        const buttonsHtml = group.items.map(opt => {
          const isActive = selectedCategories.includes(opt.id);
          const activeClasses = isActive 
            ? "bg-indigo-600 text-white border-indigo-600 shadow-lg shadow-indigo-200/50 scale-[1.03]" 
            : "bg-white text-slate-600 border-slate-200 hover:bg-slate-50 hover:border-indigo-300";

    function updateSpecificProductDropdown() {
      const select = document.getElementById("specificProductSelect");
      let html = '<option value="">-- 不指定 (僅查看大類別通用規範) --</option>';
      
      const catsToRender = selectedCategories.includes("ALL") 
        ? Object.keys(specificProductsMap) 
        : selectedCategories;

      catsToRender.forEach(catId => {
        if (specificProductsMap[catId]) {
          let catName = "";
          for(const g of categoryGroups) {
            const item = g.items.find(i => i.id === catId);
            if(item) catName = item.label;
          }
          
          html += `<optgroup label="[ ${catName} ] 關聯細項">`;
          specificProductsMap[catId].forEach(sp => {
            html += `<option value="${sp.id}">${sp.label}</option>`;
          });
          html += `</optgroup>`;
        }
      });
      
      const currentVal = select.value;
      select.innerHTML = html;
      if (currentVal && html.includes(`value="${currentVal}"`)) {
        select.value = currentVal;
      } else {
        select.value = "";
      }
    }

    function toggleCategory(id) {
      if (id === "ALL") {
        selectedCategories = ["ALL"];
      } else {
        selectedCategories = selectedCategories.filter(c => c !== "ALL");
        if (selectedCategories.includes(id)) {
          selectedCategories = selectedCategories.filter(c => c !== id);
          if (selectedCategories.length === 0) selectedCategories = ["ALL"];
        } else {
          selectedCategories.push(id);
        }
      }
      initCategoryToggles();
      updateSpecificProductDropdown();
      updateDashboard();
    }

    document.addEventListener("DOMContentLoaded", () => {
      initCategoryToggles();
      updateSpecificProductDropdown();
    });

            SP_WIFI_6E: "**🎯 Wi-Fi 6E/7 (6GHz)**：**極高風險！** 全球 6GHz 頻譜尚未統一，許多中東/南美國家仍未開放，送樣前務必確認當地法規！",

          agent: "✅ 是 (Yes)。依據文獻，絕大多數 GMA 國家皆強制要求具備當地進口商或授權代表 (Local Rep) 持證。"

    // --- UI Dashboard Update Function ---
    function updateDashboard() {
      const countryCode = document.getElementById("countrySelect").value;
      const emptyState = document.getElementById("emptyState");
      const dashboard = document.getElementById("resultDashboard");
      
      if (!countryCode) {
        emptyState.style.display = "block";
        dashboard.style.display = "none";
        return;
      }

      const data = gmaData[countryCode];

      // Update Basic Info
      document.getElementById("countryTitle").innerText = data.title;
      document.getElementById("countryDesc").innerText = data.desc;
      
      const electricalCard = document.getElementById("electricalInfoCard");
      if (data.electrical) {
        document.getElementById("localVoltage").innerText = data.electrical.voltage;
        document.getElementById("localPlug").innerText = data.electrical.plug;
        electricalCard.style.display = "flex";
      } else {
        electricalCard.style.display = "none";
      }

      // --- 智慧過濾與 Markdown 注入 (支援大類別與 SP 細項混排) ---
      const specificRuleContainer = document.getElementById("categorySpecificRule");
      let rulesHtml = "";
      
      const spSelect = document.getElementById("specificProductSelect");
      const spCode = spSelect ? spSelect.value : "";
      const spLabel = spCode ? spSelect.options[spSelect.selectedIndex].text : "";

      let spParent = null;
      if (spCode) {
        for (const [parent, items] of Object.entries(specificProductsMap)) {
          if (items.some(item => item.id === spCode)) {
            spParent = parent;
            break;
          }
        }
      }

      if (selectedCategories.includes("ALL")) {
         let content = "";
         if (spCode && data.categoryRules[spCode]) {
             content = `
                <div class="mb-4 pb-4 border-b border-slate-700/50">
                    <span class="text-amber-400 font-bold block mb-2 text-lg">🎯 精確產品細項分析 (${spLabel})：</span>
                    <div class="text-[15px]">${parseDarkMarkdown(data.categoryRules[spCode])}</div>
                </div>
             `;
         }
         content += `<div class="mb-2"><span class="text-indigo-300 font-bold mr-2 text-lg">📌 官方矩陣與合規總結：</span><div class="mt-3 text-[15px]">${parseDarkMarkdown(data.categoryRules["ALL"])}</div></div>`;
         rulesHtml = content;
      } else {
         selectedCategories.forEach(catId => {
            let catLabel = "";
            for (const group of categoryGroups) {
              const item = group.items.find(o => o.id === catId);
              if (item) { catLabel = item.label; break; }
            }
            
            let ruleText = "";
            let displayLabel = catLabel;
            let isTarget = false;
            
            // 若當前大類剛好是細項的母類別
            if (catId === spParent && data.categoryRules[spCode]) {
                ruleText = data.categoryRules[spCode];
                displayLabel = `🎯 精確產品診斷：${spLabel}`; 
                isTarget = true;
            } else if (data.categoryRules[catId]) {
                ruleText = data.categoryRules[catId];
            }

            if (ruleText) {
                const titleColor = isTarget ? "text-amber-400" : "text-indigo-300";
                rulesHtml += `
                  <div class="pb-5 mb-5 border-b border-slate-700/50 last:border-0 last:pb-0 last:mb-0">
                    <span class="${titleColor} font-bold block mb-3 text-lg">📌 ${displayLabel}：</span>
                    <div class="text-[15px]">${parseDarkMarkdown(ruleText)}</div>
                  </div>`;
            }
         });
         
         if (!rulesHtml) rulesHtml = `<div class="mb-2"><span class="text-indigo-300 font-bold mr-2 text-lg">📌 官方說明：</span><div class="mt-3 text-[15px]">${parseDarkMarkdown("依據官方指南，該國對此分類無特例，請參照一般 GMA 矩陣。")}</div></div>`;
      }
      specificRuleContainer.innerHTML = rulesHtml;

      // 重繪 3 大領域卡片，加上多選適配邏輯
      const catContainer = document.getElementById("categoriesContainer");
      catContainer.innerHTML = "";
      
      let requireRF = selectedCategories.includes("ALL") || selectedCategories.some(c => ["WIFI_BT", "IND_SWITCH", "IND_CELLULAR", "CELLULAR"].includes(c)); 
      let requireEMC = selectedCategories.includes("ALL") || !selectedCategories.every(c => ["BATTERY", "COMPONENT"].includes(c));

      // 若使用者明確選了細項，進一步覆寫判定
      if (spCode === "SP_WIFI_6E" || spCode === "SP_UWB" || spCode === "SP_RFID_NFC" || spCode === "SP_5G_ROUTER" || spCode === "SP_NB_IOT" || spCode === "SP_VEHICLE_RADAR") {
          requireRF = true;
      }

      data.categories.forEach(cat => {
        let isApplicable = true;
        let notAppMsg = "";

        if (cat.type.includes("RF") || cat.type.includes("無線") || cat.type.includes("電信") || cat.type.includes("射頻")) {
          isApplicable = requireRF;
          notAppMsg = "⚠️ 不適用 (未選擇射頻/電信特徵)";
        }
        if (cat.type.includes("EMC") || cat.type.includes("電磁")) {
          isApplicable = requireEMC;
          notAppMsg = "⚠️ 不適用 (純被動元件/電池多豁免 EMC)";
        }

        let bgClass, iconSvg, titleColor, markBg;
        if (cat.type.includes("Safety") || cat.type.includes("安規")) {
          bgClass = "bg-red-50 border-red-100"; titleColor = "text-red-700"; markBg = "text-red-800 bg-white border-red-200";
          iconSvg = `<svg class="w-6 h-6 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>`;
        } else if (cat.type.includes("EMC") || cat.type.includes("電磁")) {
          bgClass = "bg-amber-50 border-amber-100"; titleColor = "text-amber-700"; markBg = "text-amber-800 bg-white border-amber-200";
          iconSvg = `<svg class="w-6 h-6 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>`;
        } else {
          bgClass = "bg-blue-50 border-blue-100"; titleColor = "text-blue-700"; markBg = "text-blue-800 bg-white border-blue-200";
          iconSvg = `<svg class="w-6 h-6 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0" /></svg>`;
        }

        let statusBadgeClass = cat.status.includes("強制") ? "bg-red-100 text-red-700 border-red-200" : (cat.status.includes("自願") ? "bg-blue-100 text-blue-700 border-blue-200" : "bg-orange-100 text-orange-700 border-orange-200");

        const cardStateClass = isApplicable ? "" : "card-disabled";
        let disabledOverlay = isApplicable ? "" : `<div class="absolute inset-x-0 bottom-0 bg-slate-800 text-white text-xs font-bold text-center py-1.5 opacity-90 tracking-widest">${notAppMsg}</div>`;

        const card = document.createElement("div");
        card.className = `p-6 rounded-3xl border ${bgClass} flex flex-col h-full shadow-sm hover:shadow-md transition-shadow relative overflow-hidden ${cardStateClass}`;
        card.innerHTML = `
          <div class="flex items-center justify-between mb-4 border-b border-black/5 pb-3">
            <div class="flex items-center gap-2">
              ${iconSvg}
              <span class="font-bold ${titleColor} text-base uppercase tracking-wider">${cat.type}</span>
            </div>
          </div>
          <div class="mb-5 flex flex-wrap gap-2 items-center">
            <span class="inline-block px-4 py-1.5 ${markBg} rounded-xl text-sm font-black shadow-sm border">${cat.mark}</span>
            <span class="inline-block px-3 py-1 ${statusBadgeClass} rounded-lg text-xs font-bold border">${cat.status}</span>
          </div>
          <p class="text-[15px] text-slate-700 leading-relaxed mt-auto font-medium pb-4">
            <span class="font-bold block mb-1.5 opacity-80 ${titleColor}">🔬 當地測試 (In-Country Testing)：</span>
            ${cat.testing}
          </p>
          ${disabledOverlay}
        `;
        catContainer.appendChild(card);
      });

      document.getElementById("localAgent").innerHTML = `<span class="font-bold">當地代表 (Local Rep)：</span>${data.agent}`;

      emptyState.style.display = "none";
      dashboard.style.display = "block";
      
      dashboard.classList.remove("fade-in");
      void dashboard.offsetWidth; 
      dashboard.classList.add("fade-in");
    }

    // --- Utility: 專為深色面板設計的 Markdown 解析器 ---
    function parseDarkMarkdown(md) {
      if (!md) return "";
      let html = md;
      // 粗體轉換 (白色高亮)
      html = html.replace(/\*\*(.*?)\*\*/gim, '<strong class="text-white font-black">$1</strong>');
      // 項目符號轉換
      html = html.replace(/^\* (.*$)/gim, '<li class="ml-5 list-disc marker:text-indigo-400 mb-1">$1</li>');
      html = html.replace(/^- (.*$)/gim, '<li class="ml-5 list-disc marker:text-indigo-400 mb-1">$1</li>');
      // 將相鄰的 <li> 包裝進 <ul>
      html = html.replace(/(<li class="ml-5 list-disc marker:text-indigo-400 mb-1">.*<\/li>)/gim, '<ul class="mb-3">$1</ul>');
      html = html.replace(/<\/ul>\n<ul class="mb-3">/gim, '');
      // 段落處理 (排除清單)
      html = html.replace(/^(?!<ul|<li)(.*$)/gim, '<p class="mb-2 text-slate-300 leading-relaxed">$1</p>');
      return html.trim();
    }
  </script>
